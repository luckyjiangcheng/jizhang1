<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Spending Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; transition: background-color 0.5s; }
        .chart-container { width: 100%; height: 400px; margin-bottom: 30px; }
        h1 { text-align: center; }
        .summary { text-align: center; margin-bottom: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>Spending Dashboard</h1>
    <div class="summary" id="summary"></div>
    <div id="pieChart" class="chart-container"></div>
    <div id="lineChart" class="chart-container"></div>

    <script>
        const BUDGET = 3000;
        let csvData = `/* CSV_DATA_PLACEHOLDER */`;

        // Default Sample Data (if no data is provided)
        const sampleData = `Date,Time,Amount,Category,Item,Merchant
2023-10-01,08:00,15.00,Dining,Breakfast,KFC
2023-10-02,12:30,35.00,Dining,Lunch,McDonalds
2023-10-03,18:00,120.00,Shopping,Shoes,Nike
2023-10-05,09:00,50.00,Transport,Taxi,Uber
2023-10-08,19:00,200.00,Entertainment,Movie,Cinema
2023-10-12,10:00,80.00,Grocery,Fruits,Supermarket
2023-10-15,14:00,45.00,Dining,Coffee,Starbucks`;

        // Simple CSV Parser
        function parseCSV(csv) {
            // Normalize line endings and trim
            const lines = csv.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n');
            
            // Filter out empty lines and lines that don't look like data (too short)
            const nonEmptyLines = lines.filter(l => l.trim().length > 5);
            
            if (nonEmptyLines.length < 2) return [];

            const headers = nonEmptyLines[0].split(',').map(h => h.trim());
            const data = [];
            
            for (let i = 1; i < nonEmptyLines.length; i++) {
                // Handle potential trailing commas or extra whitespace
                const line = nonEmptyLines[i].trim();
                if (!line) continue;

                // Simple split by comma, doesn't handle commas inside quotes
                const row = line.split(','); 
                
                // Allow row to be longer than headers (ignore extra columns), but not shorter
                if (row.length < headers.length) continue;
                
                const obj = {};
                headers.forEach((h, index) => {
                    obj[h] = row[index] ? row[index].trim() : '';
                });
                
                // Convert Amount to number
                if (obj.Amount) {
                    obj.Amount = parseFloat(obj.Amount);
                } else {
                    obj.Amount = 0;
                }
                
                // Validate Amount is a number
                if (isNaN(obj.Amount)) {
                    obj.Amount = 0;
                }

                data.push(obj);
            }
            return data;
        }

        try {
            // Check if placeholder was replaced (or if it's still the placeholder comment)
            if (csvData.includes("/* CSV_DATA_PLACEHOLDER */")) {
                 console.log("Using sample data...");
                 csvData = sampleData; // Fallback to sample data
                 document.getElementById('summary').innerHTML += '<br><small style="color:gray">(Preview Mode: Showing Sample Data)</small>';
            }
            
            const data = parseCSV(csvData);
            
            if (data.length === 0) {
                document.getElementById('summary').innerText = 'No transaction data found.';
            } else {
                // 1. Calculate Total Spend & Check Budget
                const totalSpend = data.reduce((sum, item) => sum + (item.Amount || 0), 0);
                const percentage = ((totalSpend / BUDGET) * 100).toFixed(1);
                
                document.getElementById('summary').innerText = `Total Spend: ${totalSpend.toFixed(2)} / Budget: ${BUDGET} (${percentage}%)`;

                if (totalSpend > BUDGET * 0.8) {
                    document.body.style.backgroundColor = '#FFCC99'; // Light Orange
                }

                // 2. Prepare Data for Pie Chart (Category)
                const categoryMap = {};
                data.forEach(item => {
                    if (!item.Category) return;
                    categoryMap[item.Category] = (categoryMap[item.Category] || 0) + item.Amount;
                });
                const pieData = Object.keys(categoryMap).map(key => ({ value: categoryMap[key], name: key }));

                // 3. Prepare Data for Line Chart (Daily Cumulative)
                // Sort by Date
                data.sort((a, b) => new Date(a.Date) - new Date(b.Date));
                
                // Group by Date first to handle multiple entries per day
                const dailyMap = {};
                data.forEach(item => {
                    const date = item.Date;
                    if (!date) return;
                    dailyMap[date] = (dailyMap[date] || 0) + item.Amount;
                });

                const sortedDates = Object.keys(dailyMap).sort((a, b) => new Date(a) - new Date(b));
                let cumulative = 0;
                const lineData = sortedDates.map(date => {
                    cumulative += dailyMap[date];
                    return { date, cumulative };
                });

                // Budget Line Data (Linear Pace)
                const budgetLineData = sortedDates.map(dateStr => {
                    const date = new Date(dateStr);
                    const day = date.getDate();
                    // Get total days in this month
                    const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
                    const expected = (BUDGET / daysInMonth) * day;
                    return expected.toFixed(2);
                });

                // Render Pie Chart
                const pieChart = echarts.init(document.getElementById('pieChart'));
                pieChart.setOption({
                    title: { text: 'Consumption by Category', left: 'center' },
                    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
                    legend: { orient: 'vertical', left: 'left' },
                    series: [{
                        name: 'Category',
                        type: 'pie',
                        radius: '50%',
                        data: pieData,
                        emphasis: {
                            itemStyle: {
                                shadowBlur: 10,
                                shadowOffsetX: 0,
                                shadowColor: 'rgba(0, 0, 0, 0.5)'
                            }
                        }
                    }]
                });

                // Render Line Chart
                const lineChart = echarts.init(document.getElementById('lineChart'));
                lineChart.setOption({
                    title: { text: 'Monthly Budget Curve', left: 'center' },
                    tooltip: { trigger: 'axis' },
                    legend: { data: ['Cumulative Spend', 'Budget Pace'], top: 'bottom' },
                    xAxis: {
                        type: 'category',
                        data: sortedDates
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [
                        {
                            name: 'Cumulative Spend',
                            type: 'line',
                            data: lineData.map(d => d.cumulative),
                            smooth: true,
                            markLine: {
                                data: [
                                    { yAxis: BUDGET, name: 'Total Budget' }
                                ],
                                lineStyle: { color: 'red' }
                            }
                        },
                        {
                            name: 'Budget Pace',
                            type: 'line',
                            data: budgetLineData,
                            lineStyle: { type: 'dashed' },
                            color: 'gray'
                        }
                    ]
                });

                // Resize charts on window resize
                window.addEventListener('resize', () => {
                    pieChart.resize();
                    lineChart.resize();
                });
            }
        } catch (e) {
            console.error(e);
            document.body.innerHTML += `<p style="color:red">Error parsing data: ${e.message}</p>`;
        }
    </script>
</body>
</html>
